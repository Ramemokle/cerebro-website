<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=600">
<meta name="viewport" content="width=300,height=600">
<title>HONOR · 300x600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Noto+Sans+Georgian:wdth,wght@62.5,700;62.5,800&display=swap">
<script>var clickTag = "";</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:300px;height:600px;overflow:hidden;background:#b23a5a}
#ad{position:relative;width:300px;height:600px;overflow:hidden;cursor:pointer;
  background:radial-gradient(120% 60% at 50% 32%,#d5537a 0%,#b8395b 45%,#8e2445 100%);
  font-family:"Noto Sans Georgian",sans-serif;-webkit-font-smoothing:antialiased}
/* glowing grid behind the podium */
.grid{position:absolute;left:62px;top:100px;width:176px;height:122px;opacity:.9}
.grid line{stroke:#ff6d8f;stroke-width:1;stroke-linecap:round}
.grid .g{filter:drop-shadow(0 0 3px #ff4f7b)}
.grid .scan{stroke:#ffd1dc;stroke-width:1.4;animation:scan 2.8s linear infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(122px);opacity:0}}
/* podium */
.podium{position:absolute;left:64px;top:250px;width:174px;height:26px}
.podium .top{position:absolute;inset:0 0 auto 0;height:16px;border-radius:50%;background:linear-gradient(#fff,#ececf1)}
.podium .side{position:absolute;left:0;right:0;top:8px;height:14px;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#e2e2e8,#c9c9d2)}
.podium .shadow{position:absolute;left:10px;right:10px;top:20px;height:12px;border-radius:50%;background:rgba(60,0,20,.35);filter:blur(5px)}
.podium .glow{position:absolute;left:20px;right:20px;top:-6px;height:12px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(8px);animation:pglow 2.8s ease-in-out infinite}
@keyframes pglow{50%{opacity:.35}}
/* logo */
.logo{position:absolute;right:12px;top:22px;width:92px;height:34px;border-radius:6px;background:#fff;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
.logo img{position:absolute;left:-194px;top:-21px;width:300px;height:600px}
/* pyramid */
.pyr{position:absolute;right:12px;top:226px;width:56px;height:70px;animation:float 3s ease-in-out infinite}
.pyr-s{position:absolute;right:20px;top:300px;width:40px;height:8px;border-radius:50%;background:rgba(60,0,20,.3);filter:blur(3px);animation:fs 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes fs{50%{transform:scale(.8);opacity:.6}}
/* frames */
.f{position:absolute;inset:0;pointer-events:none}
.ph{position:absolute;left:0;top:0;width:300px;height:600px;opacity:0}
.model{position:absolute;left:0;right:0;top:292px;text-align:center;font-family:Oswald,sans-serif;font-weight:600;font-size:30px;letter-spacing:.06em;color:#fff;text-shadow:0 2px 12px rgba(60,0,20,.35);opacity:0}
.gift{position:absolute;left:18px;right:18px;top:348px;height:150px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(2px);opacity:0}
.gimg{position:absolute;left:0;top:0;width:300px;height:600px;opacity:0}
.gtag{position:absolute;left:34px;top:362px;display:flex;align-items:center;gap:6px;font-weight:800;font-stretch:62.5%;font-size:13px;letter-spacing:.04em;color:#fff;text-transform:uppercase;opacity:0}
.gtag svg{width:22px;height:22px}
.gname{position:absolute;left:0;right:0;top:470px;text-align:center;font-weight:800;font-stretch:62.5%;font-size:19px;letter-spacing:.03em;color:#fff;text-transform:uppercase;opacity:0}
/* active frame animations */
.f.on .ph.b{animation:inL .7s cubic-bezier(.2,.8,.2,1) forwards}
.f.on .ph.a{animation:inR .7s .08s cubic-bezier(.2,.8,.2,1) forwards}
.f.on .model{animation:up .5s .35s cubic-bezier(.2,.8,.2,1) forwards}
.f.on .gift{animation:fade .4s .55s forwards}
.f.on .gtag{animation:up .4s .7s forwards}
.f.on .gimg{animation:pop .6s .75s cubic-bezier(.3,1.5,.4,1) forwards}
.f.on .gname{animation:up .45s .9s cubic-bezier(.2,.8,.2,1) forwards}
.f.off .ph,.f.off .model,.f.off .gift,.f.off .gtag,.f.off .gimg,.f.off .gname{animation:out .35s forwards}
@keyframes inL{from{opacity:0;transform:translate(-40px,14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translate(40px,14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.7);transform-origin:175px 410px}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1}to{opacity:0;transform:translateY(-6px)}}
/* call to action */
.cta{position:absolute;left:50%;top:526px;transform:translateX(-50%);padding:11px 30px 12px;border-radius:999px;background:#fff;color:#b23a5a;
  font-weight:800;font-stretch:62.5%;font-size:20px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  box-shadow:0 0 0 0 rgba(255,255,255,.6),0 10px 24px -8px rgba(60,0,20,.55);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55),0 10px 24px -8px rgba(60,0,20,.55)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0),0 10px 24px -8px rgba(60,0,20,.55)}}
.cta i{display:inline-block;margin-left:8px;font-style:normal;transition:transform .3s}
#ad:hover .cta i{transform:translateX(4px)}
.border{position:absolute;inset:0;border:1px solid rgba(0,0,0,.25);pointer-events:none}
</style>
</head>
<body>
<div id="ad" role="link" aria-label="HONOR smartphones with a gift. Learn more">
  <svg class="grid" viewBox="0 0 176 122" aria-hidden="true">
    <g class="g">
      <line x1="10" y1="2" x2="166" y2="2"/><line x1="4" y1="36" x2="172" y2="36"/><line x1="2" y1="72" x2="174" y2="72"/><line x1="8" y1="108" x2="168" y2="108"/>
      <line x1="10" y1="2" x2="2" y2="120"/><line x1="52" y1="0" x2="48" y2="120"/><line x1="92" y1="0" x2="92" y2="120"/><line x1="132" y1="0" x2="136" y2="120"/><line x1="166" y1="2" x2="174" y2="120"/>
    </g>
    <line class="scan" x1="4" y1="0" x2="172" y2="0"/>
  </svg>
  <div class="podium" aria-hidden="true"><span class="shadow"></span><span class="side"></span><span class="top"></span><span class="glow"></span></div>

  <div class="f" data-i="0"><img class="ph b" src="img/1_RIGHT.png" alt=""><img class="ph a" src="img/2_LEFT.png" alt=""><div class="model">20 PRO</div></div>
  <div class="f" data-i="1"><img class="ph b" src="img/22left.png" alt=""><img class="ph a" src="img/22_right.png" alt=""><div class="model">9X 4GB</div></div>
  <div class="f" data-i="2"><img class="ph b" src="img/3_LEFT.png" alt=""><img class="ph a" src="img/3_RIGHT.png" alt=""><div class="model">10i</div></div>
  <div class="f" data-i="3"><img class="ph b" src="img/4_LEFT.png" alt=""><img class="ph a" src="img/4_RIGT.png" alt=""><div class="model">8A 3GB/64GB</div></div>
  <div class="f" data-i="4"><img class="ph b" src="img/5_LEFT.png" alt=""><img class="ph a" src="img/5_RIGT.png" alt=""><div class="model">8A 2GB/32GB</div></div>

  <div class="f g" data-i="0"><div class="gift"></div><div class="gtag"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="#fff"/><rect x="2" y="7" width="20" height="4" rx="1.5" fill="#f2f2f6"/><rect x="11" y="7" width="2.4" height="14" fill="#ff2e5f"/><path d="M12 7c-3-4-7-3-6-1s5 1 6 1zm0 0c3-4 7-3 6-1s-5 1-6 1z" fill="none" stroke="#ff2e5f" stroke-width="1.6"/></svg>ᲡᲐᲩᲣᲥᲠᲐᲓ</div><img class="gimg" src="img/1_GIFT.png" alt=""><div class="gname">ᲧᲣᲠᲡᲐᲡᲛᲔᲜᲘ</div></div>
  <div class="f g" data-i="1"><div class="gift"></div><div class="gtag"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="#fff"/><rect x="2" y="7" width="20" height="4" rx="1.5" fill="#f2f2f6"/><rect x="11" y="7" width="2.4" height="14" fill="#ff2e5f"/><path d="M12 7c-3-4-7-3-6-1s5 1 6 1zm0 0c3-4 7-3 6-1s-5 1-6 1z" fill="none" stroke="#ff2e5f" stroke-width="1.6"/></svg>ᲡᲐᲩᲣᲥᲠᲐᲓ</div><img class="gimg" src="img/2_GIFT.png" alt=""><div class="gname">ᲧᲣᲠᲡᲐᲡᲛᲔᲜᲘ</div></div>
  <div class="f g" data-i="2"><div class="gift"></div><div class="gtag"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="#fff"/><rect x="2" y="7" width="20" height="4" rx="1.5" fill="#f2f2f6"/><rect x="11" y="7" width="2.4" height="14" fill="#ff2e5f"/><path d="M12 7c-3-4-7-3-6-1s5 1 6 1zm0 0c3-4 7-3 6-1s-5 1-6 1z" fill="none" stroke="#ff2e5f" stroke-width="1.6"/></svg>ᲡᲐᲩᲣᲥᲠᲐᲓ</div><img class="gimg" src="img/3_GIFT.png" alt=""><div class="gname">ᲡᲞᲘᲙᲔᲠᲘ</div></div>
  <div class="f g" data-i="3"><div class="gift"></div><div class="gtag"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="#fff"/><rect x="2" y="7" width="20" height="4" rx="1.5" fill="#f2f2f6"/><rect x="11" y="7" width="2.4" height="14" fill="#ff2e5f"/><path d="M12 7c-3-4-7-3-6-1s5 1 6 1zm0 0c3-4 7-3 6-1s-5 1-6 1z" fill="none" stroke="#ff2e5f" stroke-width="1.6"/></svg>ᲡᲐᲩᲣᲥᲠᲐᲓ</div><img class="gimg" src="img/4_GIFT.png" alt=""><div class="gname">ᲞᲝᲠᲢᲐᲢᲣᲚᲘ ᲓᲐᲛᲢᲔᲜᲘ</div></div>
  <div class="f g" data-i="4"><div class="gift"></div><div class="gtag"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2" fill="#fff"/><rect x="2" y="7" width="20" height="4" rx="1.5" fill="#f2f2f6"/><rect x="11" y="7" width="2.4" height="14" fill="#ff2e5f"/><path d="M12 7c-3-4-7-3-6-1s5 1 6 1zm0 0c3-4 7-3 6-1s-5 1-6 1z" fill="none" stroke="#ff2e5f" stroke-width="1.6"/></svg>ᲡᲐᲩᲣᲥᲠᲐᲓ</div><img class="gimg" src="img/5_GIFT.png" alt=""><div class="gname">ᲤᲚᲔᲨ ᲛᲔᲮᲡᲘᲔᲠᲔᲑᲘᲡ ᲑᲐᲠᲐᲗᲘ</div></div>

  <svg class="pyr" viewBox="0 0 56 70" aria-hidden="true"><path d="M28 2L2 58l26 10z" fill="#f7c831"/><path d="M28 2l26 56-26 10z" fill="#e3a50f"/></svg>
  <span class="pyr-s" aria-hidden="true"></span>
  <div class="logo"><img src="img/honor_logo.png" alt="HONOR"></div>
  <div class="cta">ᲒᲐᲘᲒᲔ ᲛᲔᲢᲘ<i>→</i></div>
  <span class="border" aria-hidden="true"></span>
</div>
<script>
(function(){
  var ad=document.getElementById('ad');
  ad.addEventListener('click',function(){if(clickTag)window.open(clickTag,'_blank');});
  var phones=[].slice.call(document.querySelectorAll('.f:not(.g)')),gifts=[].slice.call(document.querySelectorAll('.f.g'));
  var N=phones.length,STEP=2800,LOOPS=2,i=-1,count=0;
  function show(k){
    [phones,gifts].forEach(function(list){list.forEach(function(f,j){
      f.classList.remove('on','off');
      if(j===k){void f.offsetWidth;f.classList.add('on');}
      else if(j===(k-1+N)%N&&count>0)f.classList.add('off');
    });});
  }
  function next(){i=(i+1)%N;show(i);count++;
    if(count<N*LOOPS)setTimeout(next,STEP);}   // Google Ads: animation stops after 30 seconds
  next();
})();
</script>
</body>
</html>
